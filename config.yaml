general:
  interval: 300
  request_timeout: 30
  retries: 3

database: jobs.db

profiles:
  - name: java-backend
    keywords:
      - Java Backend
      - Spring Boot
      - Python Developer
      - Python Backend
      - Django Developer
      - FastAPI Developer
      - Node.js Developer
      - Node.js Backend
      - Express.js Developer
    # Only include jobs posted within the last six hours.
    locations:
      - India
      - Remote
    experience_levels: []
    max_age_minutes: 360
    sources:
      - linkedin
      - instahyre
      - cutshort
    excluded_keywords:
      - Intern
      - Senior
      - Frontend
      - Front-end
      - Front End
      - UI Developer
      - User Interface
    exclude_companies:
      - TCS
      - Infosys
    remote: false
    enabled: true
    notifications: true

telegram:
  token: ""
  chat_id: ""
