services:
  job-monitor:
    build: .
    container_name: linkedin-job-monitor
    restart: unless-stopped
    network_mode: host
    working_dir: /data
    command: ["--config", "/config/config.yaml", "run"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      TZ: Asia/Kolkata
      JOB_MONITOR_DATABASE: postgresql://postgres:postgres@127.0.0.1:5432/job_search
      # Optional. Leave unset to run without Telegram notifications.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
