services:
  job-monitor:
    build: .
    container_name: linkedin-job-monitor
    restart: unless-stopped
    network_mode: host
    working_dir: /data
    command: ["--config", "/config/config.yaml", "run"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - job-data:/data
    environment:
      TZ: Asia/Kolkata
      JOB_MONITOR_DATABASE: /data/jobs.db
      # Optional. Leave unset to run without Telegram notifications.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

volumes:
  job-data:
