name: LinkedIn job monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: job-monitor-db-${{ github.ref }}
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("config.yaml")
          text = p.read_text()
          text = text.replace('token: ""', 'token: "' + __import__('os').environ.get('TELEGRAM_BOT_TOKEN', '') + '"')
          text = text.replace('chat_id: ""', 'chat_id: "' + __import__('os').environ.get('TELEGRAM_CHAT_ID', '') + '"')
          p.write_text(text)
          PY
          python -m app.main once

