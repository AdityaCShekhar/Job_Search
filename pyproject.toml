[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-job-monitor"
version = "0.1.0"
description = "A lightweight, configurable LinkedIn job monitor"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.scripts]
job-monitor = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
